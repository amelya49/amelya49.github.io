<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a2233 0%, #0b0f17 60%);
    font-family: system-ui, sans-serif;
    color: #e6e9f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #111726;
    border: 1px solid #232c42;
    border-radius: 16px;
    padding: 2.5rem;
    text-align: center;
    max-width: 380px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  p { color: #9aa4b8; font-size: 0.9rem; line-height: 1.6; }
  a {
    display: inline-block;
    margin-top: 1.5rem;
    color: #3b82f6;
    text-decoration: none;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Angemeldet</h1>
    <p>Du bist erfolgreich eingeloggt. Von hier aus kann später der eigentliche Bereich mit Inhalten weitergebaut werden.</p>
    <a href="login.html">← Zurück zum Login</a>
  </div>
</body>
</html>
